<style>
:root{
  --ink:#12213B;--ink2:#1B2E4D;--navy:#0a1f45;
  --panel:#13233d;--panel2:#1a2e4d;--line:#2c4468;--line2:#3b5a88;
  --brass:#A9822C;--gold:#E0BC63;--gold2:#C9A75A;
  --text:#e9eef6;--dim:#93a5bf;--faint:#5f7391;
  --ok:#3fb87f;--warn:#f2a93b;--bad:#e0524a;--blue:#4aa3e0;
  --paper:#F2F3EF;--slate:#5B6B79;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:'Inter',sans-serif;background:#0b1830;color:var(--text)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
[hidden]{display:none!important}
.mono{font-family:'IBM Plex Mono',monospace}
.serif{font-family:'Fraunces',serif}
.muted{color:var(--dim)}

/* ---------- LANDING ---------- */
#landing{position:fixed;inset:0;z-index:100;background:#3f6aa5;overflow:hidden;transition:opacity .6s ease,transform .6s ease}
#landing.leave{opacity:0;transform:scale(1.04);pointer-events:none}
#landing svg#bg{position:absolute;inset:0;width:100%;height:100%}
.l-vig{position:absolute;inset:0;background:radial-gradient(ellipse 52% 46% at 50% 52%,rgba(6,18,42,.72),rgba(6,18,42,.35) 55%,rgba(6,18,42,0) 100%),linear-gradient(180deg,rgba(6,18,42,.25),rgba(6,18,42,0) 30%,rgba(6,18,42,.35))}
.l-center{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);text-align:center;width:min(92vw,820px)}
.l-kicker{font-family:'IBM Plex Mono',monospace;letter-spacing:.32em;font-size:12px;color:var(--gold2);text-transform:uppercase;margin-bottom:14px}
.l-title{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(34px,6.4vw,72px);letter-spacing:.04em;margin:0;color:#f3dc9a;text-shadow:0 2px 0 #7a5d21,0 6px 24px rgba(0,0,0,.6);line-height:1.05}
.l-sub{margin:18px auto 30px;color:#d3def0;font-size:14px;max-width:560px;line-height:1.6;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.l-units{margin-top:26px;font-size:11px;letter-spacing:.18em;color:#b9c9e2;text-transform:uppercase}
.start-btn{background:linear-gradient(180deg,#123a7a,#071a3d);color:var(--gold);border:1.5px solid var(--gold2);padding:16px 62px;font-family:'Fraunces',serif;font-size:20px;letter-spacing:.3em;font-weight:600;border-radius:3px;box-shadow:0 0 0 1px #07142e,0 10px 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);transition:all .25s}
.start-btn:hover{box-shadow:0 0 0 1px #07142e,0 0 34px rgba(224,188,99,.55),inset 0 1px 0 rgba(255,255,255,.18);transform:translateY(-2px);color:#ffe9a8}
.spin{animation:spin linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.piston{animation:piston 3.2s ease-in-out infinite alternate}
@keyframes piston{from{transform:translateX(0)}to{transform:translateX(-140px)}}
.puff{animation:puff 4s ease-out infinite;opacity:0}
@keyframes puff{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:.55}100%{transform:translateY(-120px) scale(2.4);opacity:0}}

/* ---------- LOGIN (CP Portal Live style) ---------- */
#login{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--ink) 0%,var(--ink2) 100%);padding:24px;overflow:auto}
.login-card{background:#fff;color:var(--ink);width:100%;max-width:440px;padding:40px 38px 30px;border-radius:2px;box-shadow:0 30px 60px rgba(0,0,0,.35);border-top:4px solid var(--brass)}
.login-gear{display:block;margin:0 auto 10px;width:58px;height:58px}
.login-mark{font-family:'Fraunces',serif;font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);text-align:center;margin-bottom:6px}
.login-title{font-family:'Fraunces',serif;font-weight:600;font-size:25px;margin:0 0 6px;text-align:center}
.login-sub{color:var(--slate);font-size:12px;margin-bottom:24px;line-height:1.5;text-align:center}
.fl{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);margin-bottom:6px;display:block}
.login-card input[type=text],.login-card input[type=password],.login-card input[type=email]{width:100%;padding:11px 12px;border:1.5px solid #D8D9D3;border-radius:2px;font-size:12px;background:#fff;color:var(--ink)}
.login-card input:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass)}
.login-btn{width:100%;margin-top:20px;padding:13px;background:var(--ink);color:#fff;border:none;border-radius:2px;font-weight:600;font-size:12px}
.login-btn:hover{background:var(--ink2)}
.login-err{color:#B23A2E;font-size:11px;margin-top:10px;display:none}
.lk{color:var(--brass);cursor:pointer;font-size:10.5px}
.demo-box{margin-top:20px;border-top:1px dashed #D8D9D3;padding-top:14px}
.demo-box .t{font-size:10px;color:var(--slate);line-height:1.6;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{border:1px solid #D8D9D3;background:#F2F3EF;border-radius:20px;padding:4px 10px;font-size:10px;color:var(--ink);cursor:pointer}
.dchip.on{background:var(--navy,#10203E);border-color:var(--brass);color:#F3D98B}
.dchip:hover{border-color:var(--brass);color:var(--brass)}
.dgrp{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);margin:8px 0 4px}

/* ---------- APP SHELL ---------- */
#app{min-height:100vh;display:flex;background:
  radial-gradient(1200px 600px at 85% -10%,rgba(74,163,224,.08),transparent 60%),#0b1830}
.side{width:206px;flex-shrink:0;background:linear-gradient(180deg,#0a1a38,#071328);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.brand b{font-family:'Fraunces',serif;font-size:14px;letter-spacing:.04em;color:#f1d98f;line-height:1.15}
.brand-sub{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:2px 0 22px 46px}
.nav{display:flex;align-items:center;gap:9px;padding:10px 10px;border-radius:3px;color:#b8c7de;font-size:12px;font-weight:500;cursor:pointer;margin-bottom:3px;border-left:2px solid transparent;user-select:none}
.nav:hover{background:rgba(255,255,255,.05)}
.nav.on{background:rgba(169,130,44,.18);color:#fff;border-left-color:var(--gold)}
.nav .bd{margin-left:auto;background:var(--gold);color:#13233d;font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px}
.sp{flex:1}
.who{border-top:1px solid var(--line);padding-top:12px;font-size:10px;color:var(--dim);line-height:1.7}
.who b{color:#fff}
.main{flex:1;min-width:0;padding:22px 26px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:22px;border-bottom:1px solid var(--line);position:relative}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:repeating-linear-gradient(90deg,var(--brass) 0 14px,transparent 14px 28px);background-size:28px 2px;opacity:.55;animation:belt 1.4s linear infinite}
@keyframes belt{to{background-position:28px 0}}
.ttl{display:flex;align-items:center;gap:12px}
.ttl h1{font-family:'Fraunces',serif;font-size:23px;margin:0;font-weight:600}
.ttl .s{font-size:12px;color:var(--dim);margin-top:3px}
.gi{width:34px;height:34px;flex:none}
.gi .g{transform-origin:50% 50%;animation:spin 9s linear infinite}
.sw{display:flex;align-items:center;gap:8px}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.modesw{display:inline-flex;border:1px solid var(--gold);border-radius:20px;overflow:hidden}
.modesw button{background:transparent;color:var(--gold);border:0;padding:7px 16px;font-size:12px;font-weight:700;letter-spacing:.06em;cursor:pointer;font-family:inherit}
.modesw button.on{background:var(--gold);color:#0a1a3c}
select,input[type=text],input[type=number],input[type=date],textarea{background:#0c1a33;border:1px solid var(--line2);color:var(--text);padding:10px 12px;border-radius:3px;font-size:13px;width:100%;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(224,188,99,.14)}
select:disabled,input:disabled{opacity:.6}
textarea{resize:vertical;min-height:80px}
.sw select{width:auto;min-width:180px}
.btn{background:linear-gradient(180deg,#123a7a,#0a2a5c);color:var(--gold);border:1px solid var(--gold2);border-radius:3px;padding:9px 18px;font-size:12px;font-weight:600;letter-spacing:.04em}
.btn:hover{box-shadow:0 0 14px rgba(224,188,99,.35)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ok{background:linear-gradient(180deg,#1f8a5c,#146845);color:#fff;border-color:#3fb87f}
.btn.bad{background:linear-gradient(180deg,#b33a33,#862a25);color:#fff;border-color:#e0524a}
.btn.ghost{background:transparent;color:var(--dim);border-color:var(--line2)}
.btn.sm{padding:6px 12px;font-size:11px}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:4px;padding:20px 22px;margin-bottom:18px;position:relative}
.panel::before,.panel::after{content:'';position:absolute;top:8px;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f1d98f,#7a5d21);box-shadow:0 1px 1px rgba(0,0,0,.6)}
.panel::before{left:8px}.panel::after{right:8px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ph h2{font-family:'Fraunces',serif;font-size:16px;margin:0;font-weight:600}
.empty{text-align:center;color:var(--faint);padding:34px 10px;font-size:13px}

/* ---------- FORM ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.step{animation:slidein .35s ease both}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.lb{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.lb i{color:var(--bad);font-style:normal}
.other-row{display:none;gap:8px;margin-top:8px}
.other-row.on{display:flex}
.opbtn{display:flex;gap:8px}
.opbtn button{flex:1;padding:11px 6px;border-radius:3px;border:1px solid var(--line2);background:#0c1a33;color:var(--dim);font-weight:600;font-size:12px;letter-spacing:.08em}
.opbtn button.on{background:linear-gradient(180deg,#123a7a,#0a2a5c);color:var(--gold);border-color:var(--gold2)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:6px}
.tag{background:#0c1a33;border:1px solid var(--gold2);color:var(--gold);border-radius:20px;padding:4px 6px 4px 12px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.tag button{background:none;border:none;color:var(--dim);font-size:13px;padding:0 4px}
.tag button:hover{color:var(--bad)}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--dim);cursor:pointer}
.chk input{width:auto}
.hint{font-size:11px;color:var(--faint);margin-top:6px}
.prev{background:rgba(224,188,99,.08);border:1px dashed var(--gold2);border-radius:3px;padding:8px 10px;font-size:11px;color:#e7d391;margin-top:8px}
.imgbox{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
.thumb{width:62px;height:62px;object-fit:cover;border-radius:3px;border:1px solid var(--line2)}

/* icons (CP Portal Live set) */
.ic{display:inline-flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--dim);font-size:9px;text-decoration:none;background:none;border:none;padding:0}
.ic:hover{color:var(--gold)}
.ic svg{width:19px;height:19px}
.ic.dl svg circle{fill:#1f4c90}.ic.dl svg path{fill:#fff}.ic.dl:hover svg circle{fill:var(--brass)}
.ic.pen{font-size:15px}.ic.del{color:#f0786f;font-size:15px}
.icrow{display:inline-flex;gap:14px;align-items:flex-start}
.doctile{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:64px;height:64px;border:1px solid var(--line2);border-radius:6px;background:#0c1a33;color:var(--gold);padding:4px;overflow:hidden}
.doctile b{font-size:15px;letter-spacing:.04em}.doctile i{font-style:normal;font-size:8px;color:var(--dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.pvb{position:fixed;inset:0;z-index:100000;background:rgba(4,10,26,.86);display:flex;align-items:center;justify-content:center;padding:1vh 1vw}
.pvm{width:96vw;max-width:1500px;height:94vh;background:var(--panel);border:1px solid var(--line2);border-radius:8px;display:flex;flex-direction:column;padding:14px 18px;overflow:hidden}
.pvh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-shrink:0}.pvh h3{margin:0;font-size:16px}
.pvh>span{display:inline-flex;align-items:center;gap:14px}
.pvx{cursor:pointer;font-size:28px;line-height:1;color:var(--dim);padding:0 6px}.pvx:hover{color:var(--gold)}
.pvbody{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);overflow:auto}
.pvbody iframe{width:100%;height:100%;border:0;display:block}
.pvbody img{max-width:100%;max-height:100%;display:block;margin:auto}
.pv-un{padding:40px;text-align:center;color:#334;font-size:13px;line-height:1.7}

/* ---------- TICKET CARDS ---------- */
.tk{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-left:4px solid var(--faint);border-radius:4px;padding:14px 16px;margin-bottom:12px}
.tk.raised{border-left-color:var(--blue)}.tk.approved{border-left-color:var(--gold)}.tk.running{border-left-color:var(--ok)}.tk.denied{border-left-color:var(--bad)}.tk.closed{border-left-color:#7d8aa0}
.tkh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.lamp{width:10px;height:10px;border-radius:50%;background:var(--faint);flex:none}
.lamp.raised{background:var(--blue);box-shadow:0 0 8px var(--blue)}
.lamp.approved{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.lamp.running{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.1s infinite}
.lamp.denied{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.lamp.closed{background:#7d8aa0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.stp{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:2px;padding:2px 8px}
.stp.raised{color:var(--blue)}.stp.approved{color:var(--gold)}.stp.running{color:var(--ok)}.stp.denied{color:var(--bad)}.stp.closed{color:#9aa8bd}
.rep{background:rgba(242,169,59,.14);color:var(--warn);border:1px solid var(--warn);border-radius:20px;font-size:10.5px;padding:2px 9px;font-weight:600}
.tkb{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 18px;font-size:12.5px}
.tkb .k{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.tkb .v{color:var(--text);word-break:break-word}
.prob{margin-top:10px;font-size:13px;line-height:1.55;background:rgba(0,0,0,.18);border-radius:3px;padding:9px 11px}
.tka{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.clock{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--ok);letter-spacing:.06em;display:inline-flex;align-items:center;gap:8px}
.clock.w{color:var(--gold);font-size:14px}
.tk.confirm{border-left-color:#b388ff}.lamp.confirm{background:#b388ff;box-shadow:0 0 8px #b388ff}.stp.confirm{color:#b388ff}
.rwb{background:#ff9f43;color:#1a1000;font-weight:800;font-size:10px;letter-spacing:.08em;border-radius:10px;padding:2px 9px}
.l2b{background:#0b2a6b;color:#FFD700;font-weight:800;font-size:10px;letter-spacing:.08em;border-radius:10px;padding:2px 9px;border:1px solid #FFD700}
.stat.clk{cursor:pointer;transition:.15s}.stat.clk:hover{border-color:var(--gold)}.stat.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(224,188,99,.35)}
.tabs{display:inline-flex;border:1px solid var(--gold);border-radius:20px;overflow:hidden;margin:0 0 14px}
.tabs button{background:transparent;color:var(--gold);border:0;padding:8px 18px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--gold);color:#0a1a3c}.tabs .rn{background:#ff9f43;color:#000;border-radius:9px;padding:0 6px;margin-left:6px;font-size:10px}
tr.dco{cursor:pointer}tr.dco:hover td{background:rgba(224,188,99,.08)}.car{display:inline-block;transition:.15s;color:var(--gold);margin-right:6px}tr.dco.open .car{transform:rotate(90deg)}
tr.xp>td{padding:0!important;border:0!important}
.xbox{background:#FFF6C9;color:#111;border-radius:6px;margin:6px 0 14px;padding:10px 12px;border-left:5px solid #E0A800;overflow-x:auto}
.xbox table{width:100%;border-collapse:collapse;font-size:12.5px;color:#111}.xbox th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#6b5600;text-align:left;padding:6px 8px;border-bottom:1px solid #d9c36a;white-space:nowrap}
.xbox td{padding:7px 8px;border-bottom:1px solid #eadb92;vertical-align:top;color:#111}.xbox .mono{color:#111}.xbox .note{font-size:11px;color:#6b5600;margin-top:6px}
.xbox .btn{padding:4px 10px;font-size:11px}
.xbox .btn.ghost{background:#0b2a6b;color:#FFD700;border-color:#0b2a6b}
.unitbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.ub{background:transparent;color:var(--gold);border:1px solid var(--gold2);border-radius:18px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px}
.ub.on{background:var(--gold);color:#0a1a3c}.ub .n{background:#ff9f43;color:#000;border-radius:9px;padding:0 7px;font-size:11px}.ub .n.z{background:rgba(255,255,255,.15);color:inherit}
.okbar{background:rgba(63,184,127,.12);border:1px solid var(--ok);border-radius:4px;padding:12px 14px;margin:0 0 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.micbar{display:flex;align-items:center;gap:8px;margin:6px 0 2px;flex-wrap:wrap}
.micbtn{background:transparent;color:var(--gold);border:1px solid var(--gold2);border-radius:16px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.micbtn:hover{background:rgba(224,188,99,.12)}
.micbtn.rec{background:#b3261e;color:#fff;border-color:#e0524a}
.miclang{width:auto!important;max-width:150px;padding:3px 6px!important;font-size:11px!important}
.micundo{background:none;border:0;color:var(--gold);font-size:11px;text-decoration:underline;cursor:pointer;font-family:inherit}
.micst{font-size:11px;color:var(--dim)}
.mg{width:18px;height:18px}.mg .g{transform-origin:50% 50%;animation:spin 2s linear infinite}
.conv{height:10px;border-radius:5px;margin-bottom:14px;background:repeating-linear-gradient(90deg,#26406a 0 18px,#1a2e4d 18px 36px);background-size:36px 10px;animation:belt 1.2s linear infinite;border:1px solid var(--line)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:9px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:hover td{background:rgba(255,255,255,.025)}
.tw{overflow-x:auto}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
.filters>div{min-width:130px;flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.stat .n{font-family:'Fraunces',serif;font-size:30px;font-weight:600}
.stat .l{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-top:4px;display:flex;gap:7px;align-items:center}
.bar{height:10px;background:#0c1a33;border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f4c90,var(--gold));border-radius:5px}
.brow{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:12px;margin-bottom:8px}

/* ---------- MODAL / TOAST ---------- */
.mb{position:fixed;inset:0;background:rgba(3,10,24,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px}
.md{background:linear-gradient(180deg,#1a2e4d,#12223c);border:1px solid var(--line2);border-top:4px solid var(--brass);border-radius:4px;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:24px 26px}
.md.wide{max-width:900px}
.md h3{font-family:'Fraunces',serif;margin:0 0 4px;font-size:18px}
.md .ms{color:var(--dim);font-size:12px;margin-bottom:16px}
.ma{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.fr{margin-bottom:14px}
.tl{border-left:2px solid var(--line2);margin:8px 0 0 6px;padding-left:14px}
.tl div{font-size:12px;margin-bottom:8px;color:var(--dim)}
.tl b{color:var(--text)}
.imgprev{max-width:100%;max-height:78vh;display:block;margin:auto;border-radius:3px}
#toast{position:fixed;bottom:22px;right:22px;background:#0a1f45;color:#fff;border:1px solid var(--gold2);padding:12px 18px;border-radius:3px;font-size:12px;z-index:400;display:none;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#lock{position:fixed;inset:0;z-index:300;background:rgba(3,10,24,.8);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--gold);font-family:'Fraunces',serif;font-size:20px;letter-spacing:.2em}
#lock svg{width:120px;height:120px}
#lock .g{transform-origin:50% 50%;animation:spin 1.1s cubic-bezier(.2,.7,.3,1) 1 forwards}

@media(max-width:820px){
  .micbtn{padding:10px 18px;font-size:13px;min-height:42px}
  .micundo{padding:10px 4px;font-size:12px}
  .miclang{font-size:14px!important;padding:9px 6px!important;min-height:42px;max-width:170px}
  input,select,textarea{font-size:16px!important}
  #app{flex-direction:column}
  .side{width:100%;height:auto;position:sticky;top:0;z-index:50;flex-direction:row;flex-wrap:nowrap;align-items:center;overflow-x:auto;gap:2px;padding:6px 8px;-webkit-overflow-scrolling:touch}
  .brand{flex:0 0 auto;padding:0 8px 0 0;margin:0}.brand b{font-size:10px;line-height:1.15}
  .nav{flex:0 0 auto;white-space:nowrap;padding:12px 12px;border-left:0;border-bottom:3px solid transparent}
  .nav.on{border-bottom-color:var(--gold)}
  .brand-sub,.sp{display:none}
  .who{display:flex!important;align-items:center;flex:0 0 auto;margin:0 0 0 auto;padding:0;font-size:0;line-height:0}
  .who{position:sticky;right:0;background:#071a3d;padding-left:8px!important;box-shadow:-8px 0 8px #071a3d}
  .who .btn{margin:0!important;width:auto!important;font-size:12px;padding:10px 12px}
  .top{flex-wrap:wrap;gap:10px}.tools{flex-wrap:wrap;gap:8px}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .main{padding:16px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- ELITE THEME: royal-blue field + faded gold circles ---------- */
:root{--royal:linear-gradient(135deg,#0b43a0 0%,#0a3786 28%,#0a2c6c 58%,#1c2f58 82%,#3a4558 100%)}
#login,#app{background:var(--royal);background-attachment:fixed;position:relative}
#login{position:fixed}
#login::before,#app::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
 background:
  radial-gradient(circle at 12% 18%,rgba(255,190,40,.30) 0,rgba(255,190,40,.12) 13%,transparent 15%),
  radial-gradient(circle at 12% 18%,transparent 0,transparent 19%,rgba(255,200,70,.20) 19.3%,transparent 20.4%),
  radial-gradient(circle at 88% 82%,rgba(255,190,40,.26) 0,rgba(255,190,40,.09) 19%,transparent 21%),
  radial-gradient(circle at 88% 82%,transparent 0,transparent 27%,rgba(255,200,70,.18) 27.3%,transparent 28.4%),
  radial-gradient(circle at 72% 8%,rgba(255,190,40,.18) 0,transparent 10%),
  radial-gradient(circle at 30% 96%,rgba(255,190,40,.15) 0,transparent 12%)}
#app>*,#login>*{position:relative;z-index:1}
#app>.side{position:sticky}
.login-card{background:rgba(7,22,60,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#e9eef6;border:1px solid rgba(255,255,255,.14);border-top:1px solid rgba(255,255,255,.14);border-radius:30px;box-shadow:0 30px 70px rgba(2,10,34,.55),inset 0 1px 0 rgba(255,255,255,.08);max-width:470px;padding:40px 40px 30px}
.login-mark{color:#9db8ea;letter-spacing:.24em;font-family:'Inter',sans-serif;font-weight:600;font-size:10.5px}
.login-title{font-family:'Inter',sans-serif;font-weight:800;color:#f0c446;letter-spacing:.04em;text-transform:uppercase;font-size:24px}
.login-sub{color:#9db8ea}
.fl{color:#f0c446;font-weight:700;letter-spacing:.1em;font-size:10px}
.login-card input[type=text],.login-card input[type=password],.login-card select,#login select{width:100%;padding:14px 16px;border:1px solid rgba(255,255,255,.14);border-radius:16px;font-size:14px;background:rgba(3,14,44,.85);color:#fff}
.login-card input::placeholder{color:#6f86ad}
.login-card input[type=password]{padding-right:48px}
.login-card input:-webkit-autofill,.login-card input:-webkit-autofill:focus{-webkit-text-fill-color:#fff;caret-color:#fff;box-shadow:0 0 0 40px rgba(3,14,44,.98) inset;transition:background-color 9999s}
.pwwrap{position:relative}
.pweye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:#9fb2d4;padding:4px;display:flex}
.pweye:hover,.pweye.on{color:#f0c446}.pweye svg{width:22px;height:22px}
.pwalert{position:fixed;inset:0;z-index:100001;background:rgba(2,8,24,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.pwalert .box{background:#0a1f45;color:#fff;border:1px solid #f0c446;border-radius:14px;max-width:360px;width:100%;padding:24px 26px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.pwalert h3{margin:0 0 8px;color:#f0c446;font-size:17px}.pwalert p{margin:0 0 18px;font-size:13.5px;line-height:1.5;color:#e9eef6}
.login-card input:focus,.login-card select:focus{outline:none;border-color:#f0c446;box-shadow:0 0 0 3px rgba(240,196,70,.18)}
.login-btn{background:linear-gradient(180deg,#f4cf58,#d9a82a);color:#0a1f45;border-radius:16px;padding:16px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;font-size:13px;box-shadow:0 10px 26px rgba(217,168,42,.35)}
.login-btn:hover{background:linear-gradient(180deg,#ffdc6b,#e2b232)}
.login-err{color:#ff9aa8}
.demo-box{border-top:1px dashed rgba(255,255,255,.18)}
.demo-box .t{color:#8da6d2}
.dchip{background:rgba(3,14,44,.8);border:1px solid rgba(255,255,255,.16);color:#d6e2f7;border-radius:22px}
.dchip:hover{border-color:#f0c446;color:#f0c446}
.dchip.on{background:linear-gradient(180deg,#f4cf58,#d9a82a);color:#0a1f45;border-color:#f0c446;font-weight:700}
/* inside the app */
.side{background:linear-gradient(180deg,rgba(5,20,56,.78),rgba(4,14,40,.86));backdrop-filter:blur(8px);border-right:1px solid rgba(255,255,255,.10)}
.main{position:relative;z-index:1}
.panel{background:rgba(6,22,62,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:14px;box-shadow:0 14px 34px rgba(2,10,34,.35)}
.login-logo{display:block;margin:0 auto 16px;width:150px;border-radius:16px;box-shadow:0 8px 24px rgba(2,10,34,.45)}

/* ---------- MACHINE ROOM START ---------- */
#machine{position:fixed;inset:0;z-index:110;background:#07262e;opacity:0;transition:opacity .6s ease;overflow:hidden}
#machine.on{opacity:1}
#mr-svg{position:absolute;inset:0;width:100%;height:100%}
.mr-rot{transform-box:view-box}
.mr-flow{animation:mrflow 1.1s linear infinite}
@keyframes mrflow{to{stroke-dashoffset:-40}}
.mr-puff{transform-box:fill-box;transform-origin:center;animation:mrpuff 2.2s ease-out infinite;opacity:0}
@keyframes mrpuff{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:.5}100%{transform:translateY(-110px) scale(2.6);opacity:0}}
.mr-hud{position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);width:min(86vw,520px);text-align:center;padding:16px 22px 14px;background:rgba(3,16,22,.72);border:1px solid rgba(240,196,70,.35);border-radius:16px;backdrop-filter:blur(6px)}
.mr-title{font-family:'Fraunces',serif;font-weight:700;letter-spacing:.2em;color:#f3d77a;font-size:15px}
.mr-msg{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:#b9d6dc;margin:8px 0 10px;text-transform:uppercase}
.mr-track{height:6px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.mr-track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b98d2c,#ffd966);border-radius:4px;box-shadow:0 0 12px rgba(255,200,70,.7)}
.mr-skip{position:absolute;right:14px;top:8px;font-size:10px;letter-spacing:.12em;color:#8fb2ba;cursor:pointer;text-transform:uppercase}
.mr-skip:hover{color:#f3d77a}

/* ---------- 3D START SEQUENCE ---------- */
#m3d{position:fixed;inset:0;z-index:115;background:#04141a;opacity:0;transition:opacity .7s ease;overflow:hidden}
#m3d.on{opacity:1}
#gl3{position:absolute;inset:0;width:100%;height:100%;display:block}
.m3vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(2,10,14,.78) 100%)}
.m3hud{position:absolute;left:50%;top:3vh;transform:translateX(-50%);width:min(86vw,520px);text-align:center;padding:16px 22px 14px;background:rgba(3,16,22,.7);border:1px solid rgba(240,196,70,.35);border-radius:16px;backdrop-filter:blur(6px)}
.m3t{font-family:'Fraunces',serif;font-weight:700;letter-spacing:.2em;color:#f3d77a;font-size:15px}
.m3msg{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:#b9d6dc;margin:8px 0 10px;text-transform:uppercase}
.m3track{height:6px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.m3track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b98d2c,#ffd966);border-radius:4px;box-shadow:0 0 12px rgba(255,200,70,.7)}
.m3skip{position:absolute;right:14px;top:8px;font-size:10px;letter-spacing:.12em;color:#8fb2ba;cursor:pointer;text-transform:uppercase}
.m3skip:hover{color:#f3d77a}
.start-btn{position:relative;overflow:hidden}
.start-btn.pressed{animation:stPress .42s ease-out forwards;pointer-events:none}
@keyframes stPress{0%{transform:scale(1)}35%{transform:scale(.94);box-shadow:0 0 0 1px #07142e,0 0 46px rgba(240,196,70,.9),inset 0 2px 10px rgba(0,0,0,.5)}100%{transform:scale(1.03);box-shadow:0 0 0 1px #07142e,0 0 60px rgba(240,196,70,.7),inset 0 1px 0 rgba(255,255,255,.2);letter-spacing:.34em}}
.start-btn.pressed::after{content:'';position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:rgba(255,230,150,.55);animation:stRip .5s ease-out forwards}
@keyframes stRip{to{transform:scale(40);opacity:0}}
#landing.leave{transition:opacity .9s ease,transform .9s ease}
/* keep the top-right corner free for the Nexus Home button */
html.in-nexus .top,html.in-nexus header,html.in-nexus .topbar{padding-right:56px !important}

  const re=/NCPL - Thindivanam/g,to='RKT - Thindivanam',fx=v=>typeof v==='string'?v.replace(re,to):v;
  (db.tickets||[]).forEach(t=>{['raisedByName','decidedBy','acceptedBy','closedBy'].forEach(k=>{if(t[k])t[k]=fx(t[k])});(t.history||[]).forEach(h=>{if(h.by)h.by=fx(h.by)})});
  return db;
}

const sbH=(x)=>Object.assign({apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'x-nexus-token':NEXUS_TOKEN,'Content-Type':'application/json'},x||{});
async function sb(path,opt){
  const r=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+path,Object.assign({},opt,{headers:sbH(opt&&opt.headers)}));
  if(!r.ok){const tx=await r.text();let m=tx;try{m=JSON.parse(tx).message||tx}catch(e){}throw new Error(m.slice(0,200))}
  const tx=await r.text();return tx?JSON.parse(tx):null;
}
const tRow=t=>({id:t.id,company:t.company,no:t.no,mode:t.mode||'ultra',status:t.status,dept:t.dept||'',category:t.category||null,source:t.source||null,quoted_amount:t.quoted==null?null:t.quoted,amount_spent:t.amount==null?null:t.amount,invoice_type:t.invType||null,invoice_amount:t.invAmount==null?null:t.invAmount,raised_at:t.raisedAt||null,closed_at:t.closedAt||null,data:t,updated_at:new Date().toISOString()});

async function pullAll(){
  const [tk,st]=await Promise.all([sb('ewc_tickets?select=data&order=raised_at.desc'),sb('ewc_settings?select=*')]);
  const nd=seed();nd.tickets=tk.map(r=>r.data);
  st.forEach(r=>{if(nd.options[r.company]){nd.options[r.company]=Object.assign(nd.options[r.company],r.options||{});nd.opmap[r.company]=r.opmap||{}}});
  const cfr=st.find(r=>r.company==='_cfg');if(cfr)nd.cfg=Object.assign({rework:false},cfr.options||{});
  const pwr=st.find(r=>r.company==='_pw');if(pwr)nd.pw=Object.assign({},PW_DEFAULT,pwr.options||{});fixNames(nd);if(pwr&&pwr.options&&pwr.options.maintenance==='Maintanance@123')saveDB();
  const had=new Set(st.map(r=>r.company));
  const changed=JSON.stringify(nd.tickets)!==JSON.stringify(DB.tickets)||JSON.stringify(nd.options)!==JSON.stringify(DB.options);
  DB=nd;snapMake();
  const missing=COMPANIES.filter(c=>!had.has(c.code));
  if(missing.length)await sb('ewc_settings',{method:'POST',headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify(missing.map(c=>({company:c.code,options:DB.options[c.code],opmap:{}})))}).catch(()=>{});
  return changed;
}
function syncUp(){
  SYNCQ=SYNCQ.then(async()=>{
    try{
      const cur=new Map(DB.tickets.map(t=>[t.id,t]));
      for(const [id,t] of cur){
        const j=JSON.stringify(t),old=SNAP.t.get(id);
        if(!old){await sb('ewc_tickets',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(tRow(t))});SNAP.t.set(id,{j,st:t.status})}
        else if(old.j!==j){
          const r=await sb('ewc_tickets?id=eq.'+encodeURIComponent(id)+'&status=eq.'+old.st,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(tRow(t))});
          if(!r||!r.length){toast('This ticket was already changed by someone else — refreshed.');await pullAll();if(S.user)render();return}
          SNAP.t.set(id,{j,st:t.status});
        }
      }
      for(const id of [...SNAP.t.keys()]){if(!cur.has(id)){await sb('ewc_tickets?id=eq.'+encodeURIComponent(id),{method:'DELETE'});SNAP.t.delete(id)}}
      for(const c of COMPANIES){
        const j=JSON.stringify([DB.options[c.code],DB.opmap[c.code]||{}]);
        if(SNAP.s[c.code]!==j){await sb('ewc_settings',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({company:c.code,options:DB.options[c.code],opmap:DB.opmap[c.code]||{},updated_at:new Date().toISOString()})});SNAP.s[c.code]=j}
      }
      const cj=JSON.stringify(DB.cfg);
      if(SNAP.cfg!==cj){await sb('ewc_settings',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({company:'_cfg',options:DB.cfg,opmap:{},updated_at:new Date().toISOString()})});SNAP.cfg=cj}
    }catch(e){toast('Could not save to the server — '+e.message);try{await pullAll();if(S.user)render()}catch(x){}}
  });
  return SYNCQ;
}

function applyClosure(t,f){
    const miss=[];
    if(!CATS.includes(f.category))miss.push('Category');
    if(!['Invoiceable','Non-invoiceable'].includes(f.invType))miss.push('Invoice Type');
    else if(f.invType==='Invoiceable'&&(f.invAmount===''||f.invAmount==null||isNaN(Number(f.invAmount))||Number(f.invAmount)<0))miss.push('Invoice Amount');
    if(t.mode==='lite'){
      if(!(f.solution||'').trim())miss.push('Solution Given');
      if(f.amount!==''&&f.amount!=null&&(isNaN(Number(f.amount))||Number(f.amount)<0))miss.push('Amount Spent');
      if(miss.length)throw new Error('Missing: '+miss.join(', '));
      t.solution={text:f.solution.trim()};
      t.sparesUsed=(f.sparesUsed||'').trim();t.amount=(f.amount===''||f.amount==null)?null:Number(f.amount);
    }else{
    if(!(f.issue||'').trim())miss.push('Issue');if(!(f.action||'').trim())miss.push('Action Taken');if(!(f.result||'').trim())miss.push('Result');
    if(!(f.sparesUsed||'').trim())miss.push('Spares Used');if(f.amount===''||f.amount==null||isNaN(Number(f.amount))||Number(f.amount)<0)miss.push('Amount Spent');
    if(miss.length)throw new Error('Missing: '+miss.join(', '));
    t.solution={issue:f.issue.trim(),action:f.action.trim(),result:f.result.trim()};
    t.sparesUsed=f.sparesUsed.trim();t.amount=Number(f.amount);}
    t.category=f.category;t.invType=f.invType;t.invAmount=f.invType==='Invoiceable'?Number(f.invAmount):null;
    t.machineImg=f.machineImg||null;t.docImg=f.docImg||null;
    if('invoiceDoc' in f)t.invoiceDoc=f.invoiceDoc||null;
}

  create(d,user){

  retrieve(id,user){const t0=find(id);const t=guard(id,t0&&t0.status==='running'?'running':'approved',user,'manager');t.status='raised';t.decidedAt=null;t.mgrOk=false;t.ceoOk=false;t.acceptedAt=null;t.acceptedBy=null;t.auto=false;t.history.push({at:Date.now(),by:user.name,act:'Retrieved to approval queue'});saveDB()},

function find(id){return DB.tickets.find(t=>t.id===id)}
function guard(id,need,user,role){
  const t=find(id);if(!t)throw new Error('Ticket not found.');
  if(user.role!==role)throw new Error('Not allowed for your role.');
  if(user.company&&user.company!==t.company)throw new Error('This ticket belongs to another company.');
  if(t.status!==need)throw new Error('This ticket is already "'+STATUS[t.status]+'" — action not allowed.');
  return t;
}
function remember(t){
  if(!t.machine)return;
  const co=DB.opmap[t.company]=DB.opmap[t.company]||{};
  const k=opKey(t.comp,t.opNo);const a=co[k]=co[k]||[];
  if(!a.includes(t.machine))a.push(t.machine);
}
function cleanDraft(d){
  if(d.mode==='lite')return {lvl:Number(d.lvl)===2?2:1,workType:d.wtype,source:d.source,quoted:Number(d.quoted),mode:'lite',company:d.company,dept:d.dept,nature:'Lite',job:'',comp:'',opNo:'',opName:'',machine:'',spares:[],noSpare:true,process:'',problem:(d.problem||'').trim(),photo:d.photo||null};

  return {lvl:Number(d.lvl)===2?2:1,workType:d.wtype,source:d.source,quoted:Number(d.quoted),mode:'ultra',company:d.company,dept:d.dept,nature:d.nature,
    job:(can||me)?d.job:'',comp:can?d.comp:'',opNo:can?d.opNo:'',opName:can?(d.opName||'').trim():'',
    machine:(can||me)?d.machine:'',spares:d.noSpare?[]:[...d.spares],noSpare:!!d.noSpare,process:d.process||'',
    problem:(d.problem||'').trim(),photo:d.photo||null};
}
const SOURCES=['In-house','Outsourcing'];
const WTYPES=['New Job','Repair Work'];
const qOk=v=>v!==''&&v!=null&&!isNaN(Number(v))&&Number(v)>=0;
const money=v=>v==null||v===''?'—':'₹'+Number(v).toLocaleString('en-IN');
function missing(d){
  const m=[];
  if(d.mode==='lite'){if(!d.company)m.push('Location');if(!d.dept)m.push('Department');if(!d.source)m.push('Work Source');if(!d.wtype)m.push('Work Type');if(!(d.problem||'').trim())m.push('Problem Description');if(!qOk(d.quoted))m.push('Quoted Amount');return m}
const can=d.nature==='CAN',me=d.nature==='Machine/Equipment';
  if(!d.company)m.push('Location');if(!d.dept)m.push('Department');if(!d.nature)m.push('Work Nature');
  if((can||me)&&!d.job)m.push('Job Name');
  if(can){if(!d.comp)m.push('Component');if(!d.opNo)m.push('Operation');if(!(d.opName||'').trim())m.push('Operation name');if(!d.machine)m.push('Machine')}
  if(me&&!d.machine)m.push('Machine');
  if(!d.noSpare&&!(d.spares&&d.spares.length))m.push('Spare');
  if(!d.process)m.push('Process');
  if(!d.source)m.push('Work Source');if(!d.wtype)m.push('Work Type');
  if(!(d.problem||'').trim())m.push('Problem Description');if(!qOk(d.quoted))m.push('Quoted Amount');
  return m;
}

/* ---------- derived ---------- */
function repKey(t){
  if(t.nature==='CAN')return [t.company,'CAN',t.job,t.comp,t.opNo].join('|');
  if(t.nature==='Machine/Equipment')return [t.company,t.nature,t.job,t.machine].join('|');
  return [t.company,t.nature].join('|');
}
function prevClosed(t){
  if(t.mode==='lite')return null;
  const w=REPEAT_DAYS*864e5,ref=t.raisedAt||Date.now(),k=repKey(t);
  let best=null;
  DB.tickets.forEach(x=>{if(x.id!==t.id&&x.status==='closed'&&x.closedAt<ref&&ref-x.closedAt<=w&&repKey(x)===k&&(!best||x.closedAt>best.closedAt))best=x});
  return best;
}
function itemLabel(t){
  if(t.mode==='lite')return t.dept;
  if(t.nature==='CAN')return `${t.job} · ${t.comp} ${t.opNo} op${t.opName?' ('+t.opName+')':''} · ${t.machine}`;
  if(t.nature==='Machine/Equipment')return `${t.job} · ${t.machine}`;
  return t.nature;
}
function repLabel(t){
  if(t.mode==='lite')return t.dept;
  if(t.nature==='CAN')return `${t.job} · ${t.comp} ${t.opNo} op`;
  if(t.nature==='Machine/Equipment')return `${t.job} · ${t.machine}`;
  return t.nature;

  </div>`;
  const d=S.draft;$('f-opname').value=d.opName;$('f-problem').value=d.problem;$('f-source').value=d.source;$('f-wtype').value=d.wtype;$('f-quoted').value=d.quoted;$('f-lvl').value=String(d.lvl||'1');$('f-nospare').checked=d.noSpare;

function fill(sel,arr,cur,ph,extra){

  if(extra)h+=extra;
  h+=arr.map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(v)}</option>`).join('');
  h+=`<option value="__other__">Other…</option>`;
  sel.innerHTML=h;
}
function populate(){

  const cs=$('f-company');cs.innerHTML=COMPANIES.map(c=>`<option value="${c.code}"${c.code===co?' selected':''}>${esc(c.name)}</option>`).join('');
  cs.disabled=!isMgr()||!!d.editId;
  fill($('f-dept'),API.options(co,'dept'),d.dept,'Select department…');
  fill($('f-nature'),API.options(co,'nature'),d.nature,'Select work nature…');
  fill($('f-process'),API.options(co,'process'),d.process,'Select process…');

    const rest=used.length?all.filter(m=>!used.includes(m)):all;
    let h=`<option value="">Select machine…</option>`+extra+rest.map(m=>`<option value="${esc(m)}"${m===d.machine?' selected':''}>${esc(m)}</option>`).join('')+(used.length?'</optgroup>':'')+`<option value="__other__">Other…</option>`;
    $('f-machine').innerHTML=h;
  }else fill($('f-machine'),all,d.machine,'Select machine…');
  // operations
  const cnt=d.comp==='BODY'?10:5;

  document.querySelectorAll('#f-comp button').forEach(b=>b.classList.toggle('on',b.dataset.v===d.comp));
  // spares
  const chosen=d.spares;
  $('f-spare').innerHTML=`<option value="">Select spare…</option>`+API.options(co,'spare').filter(s=>!chosen.includes(s)).map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')+`<option value="__other__">Other…</option>`;
  $('f-tags').innerHTML=chosen.map((s,i)=>`<span class="tag">${esc(s)}<button data-act="rmspare" data-i="${i}" title="Remove">✕</button></span>`).join('');
  $('f-photo').innerHTML=d.photo?`<span class="icrow">${thumbOf(d.photo,'data-act="viewdraft" data-f="photo"')}${icView('data-act="viewdraft" data-f="photo"')}${icEdit('data-act="pickphoto"','Replace')}${icDel('data-act="delphoto"')}</span>`:'';
}
function flow(){
  const d=S.draft,can=d.nature==='CAN',me=d.nature==='Machine/Equipment';
  const show=(id,v)=>{const e=$(id);if(e)e.hidden=!v};
  show('st-dept',!!d.company);
  if(d.mode==='lite'){['nature','job','comp','op','opname','machine','spare','process'].forEach(i=>show('st-'+i,false));show('st-source',!!d.dept);show('st-wtype',!!d.dept&&!!d.source);show('st-problem',!!d.dept&&!!d.source&&!!d.wtype);{const q=!!d.dept&&!!d.source&&!!d.wtype&&!!(d.problem||'').trim();show('st-quoted',q);show('st-lvl',q)}$('f-repeat').innerHTML='';$('f-submit').disabled=missing(d).length>0;return}
  show('st-nature',!!d.dept);
  show('st-job',!!d.nature&&(can||me));
  show('st-comp',can&&!!d.job);
  show('st-op',can&&!!d.comp);
  show('st-opname',can&&!!d.opNo);
  show('st-machine',(can&&!!d.opNo)||(me&&!!d.job));
  const sparesReady=!!d.nature&&((can&&!!d.opNo&&!!d.machine&&!!d.opName.trim())||(me&&!!d.job&&!!d.machine)||(!can&&!me));
  show('st-spare',sparesReady);
  const spDone=sparesReady&&(d.noSpare||d.spares.length>0);
  show('st-process',spDone);
  show('st-source',spDone&&!!d.process);show('st-wtype',spDone&&!!d.process&&!!d.source);show('st-problem',spDone&&!!d.process&&!!d.source&&!!d.wtype);
  {const q=spDone&&!!d.process&&!!d.source&&!!d.wtype&&!!(d.problem||'').trim();show('st-quoted',q);show('st-lvl',q)}
  const hint=can&&d.comp&&d.opNo&&API.machinesFor(d.company,d.comp,d.opNo).length;
  // repeat hint
  const rbox=$('f-repeat');
  if(sparesReady&&(d.noSpare||d.spares.length)&&d.process){
    const pv=prevClosed(Object.assign({id:d.editId||'new'},cleanDraft(d),{raisedAt:Date.now()}));
    rbox.innerHTML=pv?`<div class="prev">🔁 <b>Repeat issue.</b> The same item was closed on ${fmtDT(pv.closedAt)} (${esc(pv.no)}). Previous action: ${esc(pv.solution.action)} — Result: ${esc(pv.solution.result)}</div>`:'';
  }else rbox.innerHTML='';
  $('f-submit').disabled=missing(d).length>0;
}
function resetBelow(level){
  const d=S.draft;
  if(level<=1){d.dept=d.dept}
  if(level<=2){d.comp='';d.opNo='';d.opName='';d.machine='';$('f-opname').value=''}
  if(level===3){d.opNo=''}
}
function raiseChange(e){
  const id=e.target.id,d=S.draft;if(!d||!id)return;
  const v=e.target.value;
  if(id==='f-source'){d.source=v;flow();return}
  if(id==='f-wtype'){d.wtype=v;flow();return}
  if(id==='f-quoted'){d.quoted=v;flow();return}
  if(id==='f-lvl'){d.lvl=v;return}
  const keyOf={'f-dept':'dept','f-nature':'nature','f-process':'process','f-job':'job','f-machine':'machine'}[id];
  if(id==='f-company'){d.company=v;d.dept=d.nature=d.job=d.machine=d.process='';d.spares=[];d.comp=d.opNo='';populate();flow();return}
  if(keyOf){
    const row=$('o-'+keyOf);
    if(v==='__other__'){row.classList.add('on');$('oi-'+keyOf).focus();return}
    row.classList.remove('on');
    d[keyOf]=v;
    if(keyOf==='nature')resetBelow(2);
    populate();flow();return;
  }
  if(id==='f-op'){d.opNo=v;populate();flow();return}
  if(id==='f-spare'){
    if(v==='__other__'){$('o-spare').classList.add('on');$('oi-spare').focus();return}
    $('o-spare').classList.remove('on');
    if(v){d.spares.push(v);d.noSpare=false;$('f-nospare').checked=false;populate();flow()}
    return;
  }
  if(id==='f-nospare'){d.noSpare=e.target.checked;if(d.noSpare)d.spares=[];populate();flow();return}
  if(id==='f-photofile'&&e.target.files[0]){
    readDoc(e.target.files[0]).then(doc=>{d.photo=doc;populate();flow()}).catch(er=>toast(er.message));
    e.target.value='';
  }
}
async function submitRaise(){
  const d=S.draft;
  try{
    if(CLOUD&&!d.editId){const b=$('f-submit');if(b)b.disabled=true;await fetchNextNo(d.company)}
    if(d.editId&&d.admin){API.adminEdit(d.editId,d,S.user);toast('Ticket details updated.');S.draft=null;S.page=d.back||'all';render();return}
    if(d.editId){API.update(d.editId,d,S.user);toast('Ticket updated'+(true?' and sent for approval.':'.'))}
    else{const t=API.create(d,S.user);S.justRaised=t.no;toast('Ticket '+t.no+' raised — waiting for '+(t.lvl===2?'Manager + CEO approval.':'manager approval.'))}
    S.draft=null;S.page='mine';render();
  }catch(err){toast(err.message);const b=$('f-submit');if(b)b.disabled=false}
}

function detailRows(t){
  if(t.mode==='lite')return [['Company',cname(t.company)],['Department',t.dept],['Work Source',t.source||'—'],['Work Type',t.workType||'—'],['Quoted amount',money(t.quoted)],['Approval level','Level '+(t.lvl||1)],['Raised by',t.raisedByName]].map(x=>`<div><div class="k">${esc(x[0])}</div><div class="v">${esc(x[1])}</div></div>`).join('');
  const r=[['Company',cname(t.company)],['Department',t.dept],['Work Nature',t.nature]];
  if(t.job)r.push(['Job Name',t.job]);
  if(t.nature==='CAN'){r.push(['Component / Operation',`${t.comp} · ${t.opNo} operation`],['Operation name',t.opName])}
  if(t.machine)r.push(['Machine',t.machine]);
  r.push(['Spares',t.noSpare?'No spare needed':t.spares.join(', ')],['Process',t.process||'—'],['Work Source',t.source||'—'],['Work Type',t.workType||'—'],['Quoted amount',money(t.quoted)],['Approval level','Level '+(t.lvl||1)],['Raised by',t.raisedByName]);
  return r.map(x=>`<div><div class="k">${esc(x[0])}</div><div class="v">${esc(x[1])}</div></div>`).join('');
}
function clock(since,until,cls){return `<span class="clock ${cls||''}"><svg class="mg" viewBox="0 0 40 40" style="${until?'display:none':''}"><g class="g"><path fill="currentColor" fill-rule="evenodd" d="M18 2h4l.8 4.2 2.6 1.1 3.6-2.4 2.8 2.8-2.4 3.6 1.1 2.6L35 14v8l-4.2.8-1.1 2.6 2.4 3.6-2.8 2.8-3.6-2.4-2.6 1.1L22 38h-4l-.8-4.2-2.6-1.1-3.6 2.4-2.8-2.8 2.4-3.6-1.1-2.6L5 22v-8l4.2-.8 1.1-2.6-2.4-3.6 2.8-2.8 3.6 2.4 2.6-1.1ZM20 13a7 7 0 1 0 .01 0Z"/></g></svg><span class="tick" data-since="${since}" data-until="${until||''}">${fmtDur((until||Date.now())-since)}</span></span>`}
function solBlock(t){const so=t.solution;if(!so)return '';
  const txt=t.mode==='lite'?esc(so.text):`<b>Issue:</b> ${esc(so.issue)}<br><b>Action:</b> ${esc(so.action)}<br><b>Result:</b> ${esc(so.result)}`;
  return `<div class="prob" style="border-left:3px solid var(--ok)"><b>Solution${t.category?' ('+esc(t.category)+')':''} by ${esc(t.closedBy||'')}:</b><br>${txt}<br><span class="muted" style="font-size:11px">Spares: ${esc(t.sparesUsed||'—')} · Spent ${money(t.amount)} · Invoice: ${esc(t.invType||'—')}${t.invType==='Invoiceable'?' '+money(t.invAmount):''}</span></div>`}
function unitBar(st){
  if(S.user.role!=='engineering')return '';
  const chip=(v,label,n)=>`<button class="ub${S.view===v?' on':''}" data-act="unit" data-v="${v}">${esc(label)}<span class="n${n?'':' z'}">${n}</span></button>`;
  return `<div class="unitbar">${COMPANIES.map(c=>chip(c.code,c.name,DB.tickets.filter(t=>t.company===c.code&&t.status===st).length)).join('')}${chip('ALL','All units',DB.tickets.filter(t=>t.status===st).length)}</div>`}
function tabBar(k,nn,rn){const cur=S.tab[k];return `<div class="tabs"><button data-act="tab" data-k="${k}" data-v="new" class="${cur==='new'?'on':''}">New Work (${nn})</button><button data-act="tab" data-k="${k}" data-v="rework" class="${cur==='rework'?'on':''}">Rework${rn?`<span class="rn">${rn}</span>`:''} (${rn})</button></div>`}
function card(t,actions,opts){
  opts=opts||{};
  const rep=prevClosed(t);
  let extra='';
  if(t.status==='denied')extra+=`<div class="prob" style="border-left:3px solid var(--bad)"><b>Denied by ${esc(t.decidedBy)}:</b> ${esc(t.denyReason)}</div>`;
  if(opts.repeatInfo&&rep)extra+=`<div class="prev">🔁 <b>Repeat issue</b> — previously closed ${fmtDT(rep.closedAt)} (${esc(rep.no)}).<br>Previous action: ${esc(rep.solution.action)}<br>Result: ${esc(rep.solution.result)}</div>`;
  if(t.rw&&t.status!=='closed'&&t.status!=='denied'){const lr=lastRound(t);extra+=`<div class="prob" style="border-left:3px solid #ff9f43"><b>Rework #${t.rw}</b> — sent back by ${esc(lr?lr.reasonBy:'')}: “${esc(t.reworkReason)}”${lr?`<br><span class="muted" style="font-size:11px">Previous round: spent ${money(lr.amount)} · invoice ${esc(lr.invType||'—')}${lr.invType==='Invoiceable'?' '+money(lr.invAmount):''} · quoted ${money(t.quoted)} · total spent so far ${money(spentSoFar(t))}</span>`:''}</div>`}
  if(t.status==='confirm')extra+=solBlock(t);
  let timer='';
  if(t.status==='confirm')timer=`<span class="muted" style="font-size:11px">Waiting for ${esc(t.raisedByName)} to confirm</span> ${clock(t.confirmAt,null,'w')}`;
  if(t.status==='approved')timer=`<span class="muted" style="font-size:11px">Waiting in lobby</span> ${clock(t.decidedAt,null,'w')}`;
  if(t.status==='running')timer=`<span class="muted" style="font-size:11px">Work in Progress · by ${esc(t.acceptedBy)}</span> ${clock(t.acceptedAt,null)}`;
  return `<div class="tk ${t.status}">
    <div class="tkh"><span class="lamp ${t.status}"></span><b class="mono">${esc(t.no)}</b><span class="stp ${t.status}">${esc(stText(t))}</span>${t.rw?`<span class="rwb">REWORK #${t.rw}</span>`:''}${(t.lvl||1)===2?'<span class="l2b">LEVEL 2</span>':''}${rep?'<span class="rep">🔁 Repeat</span>':''}<span class="sp"></span><span class="muted mono" style="font-size:11px">${fmtDT(t.raisedAt)}</span></div>
    <div class="tkb">${detailRows(t)}</div>
    <div class="prob">${esc(t.problem)}${t.photo?`<div style="margin-top:8px"><span class="icrow">${thumbOf(t.photo,`data-act="viewimg" data-id="${t.id}" data-f="photo"`)}${icView(`data-act="viewimg" data-id="${t.id}" data-f="photo"`)}${icDl(`data-act="dlimg" data-id="${t.id}" data-f="photo"`)}</span></div>`:''}</div>
    ${extra}
    <div class="tka">${timer}<span class="sp"></span>${actions||''}${tkIcons(t,true)}</div>
  </div>`;
}
function list(arr,fn,emptyMsg){return arr.length?arr.map(fn).join(''):`<div class="panel"><div class="empty">${emptyMsg}</div></div>`}

function pageMine(p){

  const conf=mineAll.filter(t=>t.status==='confirm').sort((a,b)=>a.confirmAt-b.confirmAt);
  const l=mineAll.filter(t=>t.status!=='closed'&&t.status!=='confirm').sort((a,b)=>b.raisedAt-a.raisedAt);
  const closed=mineAll.filter(t=>t.status==='closed').sort((a,b)=>b.closedAt-a.closedAt);
  p.innerHTML=(S.justRaised?`<div class="okbar"><b>✓ Ticket ${esc(S.justRaised)} raised and sent for approval.</b><span class="sp"></span><button class="btn" data-act="raiseagain">＋ Raise another ticket</button></div>`:'')+(conf.length?`<div class="ph"><h2>Awaiting your confirmation (${conf.length})</h2></div>`+conf.map(t=>card(t,`<button class="btn ok" data-act="confask" data-id="${t.id}">✓ Confirm & Close</button>${DB.cfg.rework?`<button class="btn bad" data-act="rwask" data-id="${t.id}">↻ Rework</button>`:'<span class="muted" style="font-size:11px">Stays open until you confirm the fix</span>'}`)).join('')+`<div class="ph" style="margin-top:22px"><h2>Other open tickets</h2></div>`:'')+

/* ---------- Log ---------- */
function logRows(){
  const f=S.logF,from=f.from?new Date(f.from).getTime():0,to=f.to?new Date(f.to).getTime()+864e5:Infinity,q=f.q.trim().toLowerCase();
  return vis().filter(t=>(!f.status||t.status===f.status)&&(S.mode==='lite'||!f.nature||t.nature===f.nature)&&t.raisedAt>=from&&t.raisedAt<to&&(!q||(t.no+' '+itemLabel(t)+' '+t.problem+' '+(t.solution?(t.solution.text||(t.solution.action+' '+t.solution.result)):'')).toLowerCase().includes(q))).sort((a,b)=>(b.closedAt||b.decidedAt)-(a.closedAt||a.decidedAt));
}

const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

    parts.push(new Uint8Array(h),nm,d);
    const c=[];w32(c,0x02014b50);w16(c,20);w16(c,20);w16(c,0x0800);w16(c,0);w16(c,0);w16(c,0x21);w32(c,crc);w32(c,d.length);w32(c,d.length);w16(c,nm.length);w16(c,0);w16(c,0);w16(c,0);w16(c,0);w32(c,0);w32(c,off);
    cd.push(new Uint8Array(c),nm);off+=h.length+nm.length+d.length;
  });
  let cs=0;cd.forEach(x=>cs+=x.length);
  const e=[];w32(e,0x06054b50);w16(e,0);w16(e,0);w16(e,files.length);w16(e,files.length);w32(e,cs);w32(e,off);w16(e,0);

}

function buildXlsx(headers,rows,sheet,title){

  let sd=`<row r="1" ht="36" customHeight="1">${headers.map((h,c)=>cell(c===0?title:'',1,c,3)).join('')}</row><row r="2" ht="30" customHeight="1">${headers.map((h,c)=>cell(h,2,c,1)).join('')}</row>`;
  rows.forEach((r,i)=>{sd+=`<row r="${i+3}">${r.map((v,c)=>cell(v===''||v==null?'—':v,i+3,c,2)).join('')}</row>`});

  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="3"><font><sz val="11"/><color rgb="FF000000"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="11"/><color rgb="FFFFD700"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="16"/><color rgb="FFFFD700"/><name val="Calibri"/><family val="2"/></font></fonts><fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0B2A6B"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FF3F72C9"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FF000000"/></left><right style="thin"><color rgb="FF000000"/></right><top style="thin"><color rgb="FF000000"/></top><bottom style="thin"><color rgb="FF000000"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="2" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;

    {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${sn}" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml',data:styles},
    {name:'xl/worksheets/sheet1.xml',data:sheetXml}

}

/* ============================================================
   VOICE TYPING + SMART TIDY  (browser speech recognition; no keys)
   ============================================================ */
const TIDY_GLOSS={teh:'the',adn:'and',becuase:'because',wich:'which',thier:'their',recieved:'received',seperate:'separate',replacment:'replacement',moter:'motor',bering:'bearing',bearng:'bearing',hydralic:'hydraulic',conveyer:'conveyor',greese:'grease',compresser:'compressor',cylindar:'cylinder',sensar:'sensor',pls:'please',plz:'please',dont:"don't",cant:"can't",wont:"won't",didnt:"didn't",doesnt:"doesn't",isnt:"isn't",wasnt:"wasn't",couldnt:"couldn't",shouldnt:"shouldn't",im:"I'm",ive:"I've"};
function tidyText(t,o){
  o=o||{};let s=String(t==null?'':t).replace(/\r/g,'');
  if(o.dict){
    s=s.replace(/\s*\bfull stop\b\s*/gi,'. ').replace(/\s*\bcomma\b\s*/gi,', ').replace(/\s*\b(?:new line|next line)\b\s*/gi,'\n').replace(/\b(?:um+|uh+|hmm+|erm)\b[,.]?\s*/gi,'');
  }
  const dev=/[ऀ-ॿ]/.test(s);
  let lines=s.split('\n').map(L=>{
    L=L.replace(/[ \t]+/g,' ').trim();if(!L)return '';
    L=L.replace(/\s+([,.;:!?])/g,'$1');
    L=L.replace(/([,;])(?=[A-Za-z])/g,'$1 ').replace(/([A-Za-z])(:)(?=[A-Za-z])/g,'$1$2 ').replace(/([a-z])\.(?=[A-Z])/g,'$1. ').replace(/([!?])(?=[A-Za-z])/g,'$1 ');
    L=L.replace(/\b(the|a|an|and|is|to|of|in|it|on|at|for)\s+\1\b/gi,'$1');
    L=L.replace(/\b[A-Za-z]+\b/g,w=>{const k=w.toLowerCase();if(w==='i')return 'I';const g=TIDY_GLOSS[k];if(!g)return w;return w[0]===w[0].toUpperCase()&&w!==k?g[0].toUpperCase()+g.slice(1):g});
    L=L.replace(/(^|[.!?]\s+)(\p{Ll})/gu,(m,a,b,off,str)=>{if(a&&/\b(?:e\.g|i\.e|etc|vs|no|approx|dia|qty|sr|mr|dr)\.\s+$/i.test(str.slice(0,off+a.length)))return m;return a+b.toUpperCase()});
    L=L.replace(/([,;])\1+/g,'$1');
    if(!o.light&&!dev&&L.split(' ').length>=3&&/[\p{L}\p{N})\]]$/u.test(L))L+='.';
    return L});
  return lines.join('\n').replace(/\n{3,}/g,'\n\n').replace(/^\n+|\n+$/g,'');
}
(function(){
  const IDS={'f-problem':0,'c-solution':0,'c-issue':0,'c-action':0,'c-result':0,'c-spares':1,'deny-reason':0,'cf-text':0};
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let LANG='en-IN';try{LANG=localStorage.getItem('ewc_lang')||'en-IN'}catch(e){}
  let REC=null,ACT=null,ACTEL=null,SETTING=false,T=null;
  const LANGS=[['en-IN','English (India)'],['ta-IN','தமிழ் Tamil'],['hi-IN','हिन्दी Hindi']];
  const mk=id=>{const d=document.createElement('div');d.className='micbar';d.dataset.for=id;
    d.innerHTML=`<button type="button" class="micbtn" title="Speak instead of typing">🎤 Speak</button><select class="miclang" title="Speaking language">${LANGS.map(l=>`<option value="${l[0]}"${l[0]===LANG?' selected':''}>${l[1]}</option>`).join('')}</select><button type="button" class="micundo" hidden>↶ Undo auto-fix</button><span class="micst"></span>`;return d};
  const barOf=el=>el&&el.nextElementSibling&&el.nextElementSibling.classList.contains('micbar')?el.nextElementSibling:null;
  function setVal(el,v){SETTING=true;el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));SETTING=false}
  function applyTidy(el,dict){
    const before=el.value,after=tidyText(before,{light:!!IDS[el.id],dict:dict});
    const b=barOf(el);
    if(after!==before){el.__raw=before;setVal(el,after);if(b)b.querySelector('.micundo').hidden=false}
  }
  function ui(el,on,msg){const b=barOf(el);if(!b)return;const bt=b.querySelector('.micbtn');bt.classList.toggle('rec',on);bt.textContent=on?'⏹ Stop':'🎤 Speak';b.querySelector('.micst').textContent=msg||''}
  function stopRec(abort){const r=REC;if(r){try{abort?r.abort():r.stop()}catch(e){}}}
  function finish(){
    const el=ACTEL;REC=null;ACT=null;ACTEL=null;
    if(el&&document.contains(el)){ui(el,false,'');applyTidy(el,true)}
  }
  function start(el){
    if(!SR){toast('Voice typing works in Chrome or Edge. You can still type normally.');return}
    if(REC)stopRec(true);
    let r;try{r=new SR()}catch(e){toast('Voice typing is not available in this browser.');return}
    const MOB=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'');
    r.lang=LANG;r.continuous=!MOB;r.interimResults=true;
    const base=el.value,sep=base&&!/\s$/.test(base)?' ':'';
    el.__raw=base;
    r.onresult=ev=>{let fin='',itr='';for(let i=0;i<ev.results.length;i++){const x=ev.results[i];if(x.isFinal)fin+=x[0].transcript;else itr+=x[0].transcript}
      setVal(el,base+(fin||itr?sep:'')+(fin+itr).replace(/^\s+/,''));
      const b=barOf(el);if(b)b.querySelector('.micundo').hidden=true};
    r.onerror=e=>{const m={'not-allowed':'Microphone is blocked — click the 🔒 in the address bar and allow it.','service-not-allowed':'Microphone is blocked — click the 🔒 in the address bar and allow it.','no-speech':'No speech heard — try again.','network':'Voice typing needs the internet.','audio-capture':'No microphone found.','language-not-supported':'This language is not supported by your browser.'}[e.error];if(m)toast(m)};
    r.onend=()=>{if(REC===r)finish()};
    REC=r;ACT=el.id;ACTEL=el;
    try{r.start();ui(el,true,MOB?'● Listening… speak one sentence, then pause':'● Listening… speak now');el.focus()}catch(e){REC=null;ACT=null;ACTEL=null;toast('Could not start the microphone — try again.')}
  }
  function micify(){
    Object.keys(IDS).forEach(id=>{const el=document.getElementById(id);if(el&&!el.dataset.mic){el.dataset.mic='1';el.spellcheck=true;el.insertAdjacentElement('afterend',mk(id))}});
    if(REC&&ACTEL&&!document.contains(ACTEL)){stopRec(true);REC=null;ACT=null;ACTEL=null}
  }
  document.addEventListener('click',e=>{
    const bt=e.target.closest('.micbtn'),un=e.target.closest('.micundo');
    if(bt){const el=document.getElementById(bt.parentElement.dataset.for);if(!el)return;if(ACT===el.id)stopRec(false);else start(el);return}
    if(un){const el=document.getElementById(un.parentElement.dataset.for);if(el&&el.__raw!=null){setVal(el,el.__raw);el.__raw=null}un.hidden=true;if(el)el.focus()}
  });
  document.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('miclang')){LANG=e.target.value;try{localStorage.setItem('ewc_lang',LANG)}catch(x){}document.querySelectorAll('.miclang').forEach(s=>s.value=LANG)}});
  document.addEventListener('focusout',e=>{const el=e.target;if(el&&el.id&&(el.id in IDS)&&ACT!==el.id)applyTidy(el,false)});
  document.addEventListener('input',e=>{const el=e.target;if(!SETTING&&el&&el.id&&(el.id in IDS)){const b=barOf(el);if(b)b.querySelector('.micundo').hidden=true}});
  new MutationObserver(()=>{clearTimeout(T);T=setTimeout(micify,120)}).observe(document.body,{childList:true,subtree:true});
  micify();
})();

async function nexusStart(tok){
  let u=null;
  try{const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/nexus_session',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:tok})});if(!r.ok)throw 0;const t=await r.text();u=t?JSON.parse(t):null}
  catch(e){showNexusMsg('Could not verify your Nexus sign-in. Check your internet and reopen this tile.');return}
  if(!u){showNexusMsg('Your Nexus session has ended. Please sign in again in CP NEXUS.');return}
  if(!ROLE_OK.includes(u.role_id)){showNexusMsg('Your role ('+(u.role_name||u.role_id)+') is not set up for the Engineering Work Card. Please ask your administrator.');return}
  NEXUS_USER=u;NEXUS_TOKEN=tok;
  try{await pullAll()}catch(e){showNexusMsg('Cannot reach the server — '+e.message);return}
  const team=NEXUS_TEAM[u.role_id];let co='';
  if(team!=='manager'&&team!=='ceo'){co=await nexusUnit()}
  S.mode='lite';try{localStorage.setItem('ewc_mode','lite')}catch(e){}
  const nm=(u.display_name||u.username);
  const r=buildUser(team,co,nm);if(!r){showNexusMsg('Could not open your unit.');return}
  r.user.email=u.username;
  $('login').hidden=true;startApp(r.user,r.view);
  setInterval(()=>{if(document.hidden)return;window.__pull().catch(()=>{})},12000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)window.__pull().catch(()=>{})});
  setInterval(async()=>{ /* a disabled / signed-out person loses access within minutes */
    try{const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/nexus_session',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:NEXUS_TOKEN})});
      const t=await r.text();if(r.ok&&!(t&&JSON.parse(t))){NEXUS_TOKEN='';S.user=null;$('app').hidden=true;showNexusMsg('Your Nexus session has ended. Please sign in again in CP NEXUS.')}}catch(e){}
  },180000);
}
